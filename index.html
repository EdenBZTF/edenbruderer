<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eden Bruderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      background: #0a0a12;
    }

    /* ── ANIMATED GRADIENT BG ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: #0a0a12;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: drift linear infinite;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #3a6bff, #1a3aaa);
      top: -120px; left: -100px;
      animation-duration: 18s;
    }
    .orb-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #8b3aff, #4a1a88);
      bottom: -100px; right: -80px;
      animation-duration: 22s;
      animation-delay: -8s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #ff5f8a, #aa2a55);
      top: 50%; left: 55%;
      animation-duration: 15s;
      animation-delay: -4s;
    }
    .orb-4 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #00d4ff, #0088aa);
      bottom: 20%; left: 10%;
      animation-duration: 20s;
      animation-delay: -12s;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(40px, -30px) scale(1.05); }
      50%  { transform: translate(-20px, 50px) scale(0.97); }
      75%  { transform: translate(30px, 20px) scale(1.03); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* noise overlay */
    .bg::after {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      opacity: 0.035;
      pointer-events: none;
    }

    /* ── CARD ── */
    .card {
      position: relative; z-index: 10;
      width: 100%; max-width: 400px;
      display: flex; flex-direction: column; align-items: center;
      padding: 2.5rem 2rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 32px 80px rgba(0,0,0,0.5);
    }

    /* ── AVATAR ── */
    .avatar {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem; font-weight: 800;
      color: #fff;
      margin-bottom: 1.25rem;
      opacity: 0; animation: fadeUp 0.5s 0.1s forwards;
      backdrop-filter: blur(10px);
      position: relative;
    }
    .avatar::after {
      content: '';
      position: absolute; inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #3a6bff, #8b3aff, #ff5f8a, #3a6bff);
      z-index: -1;
      opacity: 0.7;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── NAME ── */
    .name {
      font-family: 'Syne', sans-serif;
      font-size: 1.7rem; font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      opacity: 0; animation: fadeUp 0.5s 0.2s forwards;
    }

    .role {
      font-size: 0.72rem; font-weight: 400;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-top: 0.4rem; margin-bottom: 2rem;
      opacity: 0; animation: fadeUp 0.5s 0.3s forwards;
    }

    /* ── LINKS ── */
    .links {
      width: 100%;
      display: flex; flex-direction: column;
      gap: 0.65rem;
    }

    .link {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.95rem 1.2rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      text-decoration: none; color: #fff;
      backdrop-filter: blur(10px);
      transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      opacity: 0;
    }
    .link:nth-child(1) { animation: fadeUp 0.5s 0.45s forwards; }
    .link:nth-child(2) { animation: fadeUp 0.5s 0.57s forwards; }
    .link:nth-child(3) { animation: fadeUp 0.5s 0.69s forwards; }

    .link:hover {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }

    .link-left {
      display: flex; align-items: center; gap: 0.9rem;
    }

    .link-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .link-icon svg {
      width: 18px; height: 18px;
      fill: #fff;
    }

    .icon-insta  { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .icon-linkedin { background: #0a66c2; }
    .icon-github { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.15); }

    .link-text { }
    .link-platform {
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 0.1rem;
    }
    .link-handle {
      font-family: 'Syne', sans-serif;
      font-size: 0.92rem; font-weight: 600;
      color: #fff;
    }

    .link-arrow {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.25);
      transition: color 0.2s, transform 0.2s;
    }
    .link:hover .link-arrow {
      color: rgba(255,255,255,0.8);
      transform: translate(3px, -3px);
    }

    /* ── FOOTER ── */
    .footer-note {
      margin-top: 1.75rem;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.06em;
      opacity: 0; animation: fadeIn 0.6s 1s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
  </style>
</head>
