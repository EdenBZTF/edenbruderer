<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eden Bruderer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* avatar */
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      opacity: 0;
      animation: up 0.5s 0.1s forwards;
    }

    .name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: up 0.5s 0.2s forwards;
    }

    .bio {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.35rem;
      margin-bottom: 2rem;
      letter-spacing: 0.01em;
      opacity: 0;
      animation: up 0.5s 0.3s forwards;
    }

    /* links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: #1e2130;
      border: 1px solid #2a2f45;
      border-radius: 12px;
      text-decoration: none;
      color: #e2e8f0;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      opacity: 0;
    }
    .link:nth-child(1) { animation: up 0.45s 0.4s forwards; }
    .link:nth-child(2) { animation: up 0.45s 0.5s forwards; }
    .link:nth-child(3) { animation: up 0.45s 0.6s forwards; }

    .link:hover {
      background: #252a3d;
      border-color: #3b4460;
      transform: translateY(-2px);
    }
    .link:active { transform: translateY(0); }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .link-icon svg { width: 18px; height: 18px; fill: #fff; display: block; }
    .ig { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .li { background: #0a66c2; }
    .gh { background: #24292e; }

    .link-name {
      font-size: 0.92rem;
      font-weight: 500;
      color: #e2e8f0;
      flex: 1;
    }

    .link-arrow {
      font-size: 0.8rem;
      color: #475569;
      transition: color 0.15s;
    }
    .link:hover .link-arrow { color: #94a3b8; }

    /* footer */
    .footer {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #334155;
      opacity: 0;
      animation: fadeIn 0.5s 0.9s forwards;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
